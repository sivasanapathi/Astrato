<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrato Bulk Report Upload</title>
  <style>
    /* Ensure transparent background and tight bounds inside Astrato iFrame */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Button matching Astrato UI theme (#0b5c7a) */
    .astrato-btn {
      background-color: #0b5c7a;
      color: #ffffff;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      transition: background-color 0.2s ease, transform 0.1s ease;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .astrato-btn:hover {
      background-color: #084359;
    }

    .astrato-btn:active {
      transform: scale(0.98);
    }

    /* Hide standard HTML file picker input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept=".xlsx, .csv" onchange="handleFileUpload(this.files)" />

  <!-- Native-looking Astrato Button -->
  <button class="astrato-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
    Upload bulk report request
  </button>

  <script>
    function handleFileUpload(files) {
      if (files.length === 0) return;

      const btn = document.getElementById('uploadBtn');
      const fileName = files[0].name;

      // Update button state to visually reflect progress
      btn.innerText = "Uploading " + fileName + "...";
      btn.style.backgroundColor = "#d97706"; // Amber processing color

      const formData = new FormData();
      formData.append("file", files[0]);

      /*
        REPLACE 'YOUR_GCP_FUNCTION_URL' WITH YOUR GCP CLOUD FUNCTION / API ENDPOINT.
        For POC testing prior to deploying the backend, this fallback block simulates success.
      */
      const gcpEndpoint = "YOUR_GCP_FUNCTION_URL";

      fetch(gcpEndpoint, {
        method: "POST",
        body: formData
      })
      .then(response => {
        if (!response.ok) throw new Error("Server error");
        return response.json();
      })
      .then(data => {
        showSuccessState(btn);
      })
      .catch(error => {
        // Fallback execution for live UI manager demonstration before GCP backend is live
        console.log("File captured locally for POC demonstration:", fileName);
        showSuccessState(btn);
      });
    }

    function showSuccessState(btn) {
      btn.innerText = "✓ Uploaded & Emails Sent!";
      btn.style.backgroundColor = "#2e7d32"; // Success green

      // Reset button back to default state after 4 seconds
      setTimeout(() => {
        btn.innerText = "Upload bulk report request";
        btn.style.backgroundColor = "#0b5c7a";
        document.getElementById('fileInput').value = ""; // Reset file input
      }, 4000);
    }
  </script>
</body>
</html>
